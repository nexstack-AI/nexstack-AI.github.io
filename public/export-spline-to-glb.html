<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spline to GLB Export</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #fff; }
    #drop-zone {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 420px; max-width: 90vw; padding: 48px 32px;
      border: 2px dashed #4b5563; border-radius: 16px;
      text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s; z-index: 9998;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: #6366f1; background: rgba(99,102,241,0.08);
    }
    #drop-zone.hidden { display: none; }
    #drop-zone h2 { margin: 0 0 8px; font-size: 18px; color: #d1d5db; }
    #drop-zone p { margin: 0; font-size: 13px; color: #6b7280; }
    #controls {
      position: fixed; top: 16px; right: 16px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px;
    }
    button {
      padding: 10px 20px; border: none; border-radius: 8px;
      background: #6366f1; color: #fff; font-weight: 600;
      cursor: pointer; font-size: 14px;
    }
    button:hover { background: #4f46e5; }
    button:disabled { background: #374151; cursor: not-allowed; }
    #status {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #1f2937; padding: 8px 16px; border-radius: 8px;
      font-size: 13px; color: #9ca3af; z-index: 9999; max-width: 80vw;
      text-align: center;
    }
    #error-log {
      position: fixed; bottom: 60px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px;
      font-size: 12px; color: #f87171; font-family: monospace;
      white-space: pre-wrap; display: none; max-height: 200px; overflow: auto; z-index: 9999;
    }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
  </style>
</head>
<body>
  <div id="drop-zone">
    <h2>Drop a .spline file here</h2>
    <p>or click to select</p>
    <input type="file" id="file-input" accept=".spline" style="display:none" />
  </div>
  <div id="controls">
    <button id="exportBtn" disabled>Export GLB</button>
    <button id="logSceneBtn" disabled>Log Scene Tree</button>
  </div>
  <div id="status">Drag & drop a .spline file to begin</div>
  <div id="error-log"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const statusEl = document.getElementById('status');
    const errorLog = document.getElementById('error-log');
    const exportBtn = document.getElementById('exportBtn');
    const logBtn = document.getElementById('logSceneBtn');

    let splineApp = null;
    let threeScene = null;
    let Application = null;

    function setStatus(msg, isError) {
      console.log(isError ? '[ERROR]' : '[INFO]', msg);
      statusEl.textContent = msg;
      if (isError) {
        errorLog.style.display = 'block';
        errorLog.textContent += msg + '\n';
      }
    }

    async function loadSplineRuntime() {
      setStatus('Loading Spline runtime…');
      const mod = await import('https://cdn.jsdelivr.net/npm/@splinetool/runtime@1.12.0/build/runtime.js');
      return mod.Application;
    }

    function extractThreeScene(app) {
      if (app._scene?.isScene) return app._scene;
      if (app.scene) {
        if (app.scene.scene?.isScene) return app.scene.scene;
        if (app.scene.isScene) return app.scene;
      }
      for (const key of Object.getOwnPropertyNames(app)) {
        try { const v = app[key]; if (v && v.isScene) return v; } catch (e) {}
      }
      return null;
    }

    function resetApp() {
      threeScene = null;
      if (splineApp) {
        try { splineApp.dispose(); } catch(e) {}
        splineApp = null;
      }
      exportBtn.disabled = true;
      logBtn.disabled = true;
      dropZone.classList.remove('hidden');
    }

    async function loadFile(file) {
      if (!Application) {
        try { Application = await loadSplineRuntime(); } catch (e) {
          setStatus('Failed to load Spline runtime: ' + e.message, true); return;
        }
      }

      resetApp();

      try {
        const url = URL.createObjectURL(file);
        setStatus('Parsing ' + file.name + '…');

        const canvas = document.querySelector('canvas') || (() => {
          const c = document.createElement('canvas'); c.id = 'spline-canvas';
          document.body.appendChild(c); return c;
        })();

        splineApp = new Application(canvas);
        await splineApp.load(url);
        URL.revokeObjectURL(url);

        // Allow textures/geometries to settle
        await new Promise(r => setTimeout(r, 2000));

        threeScene = extractThreeScene(splineApp);

        if (!threeScene) {
          setStatus('ERROR: Cannot extract THREE.Scene. Try Log Scene Tree to inspect.', true);
          return;
        }

        dropZone.classList.add('hidden');
        setStatus('Loaded: ' + file.name + ' — ' + threeScene.children.length + ' children. Ready.');
        exportBtn.disabled = false;
        logBtn.disabled = false;
      } catch (e) {
        setStatus('Failed to load ' + file.name + ': ' + e.message, true);
        console.error(e);
      }
    }

    function doExport() {
      if (!threeScene) { setStatus('No scene loaded.', true); return; }
      setStatus('Exporting to GLB…');
      try {
        const exporter = new GLTFExporter();
        exporter.parse(threeScene, (result) => {
          if (result instanceof ArrayBuffer) {
            const blob = new Blob([result], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url;
            a.download = 'model.glb'; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
            setStatus('SUCCESS: model.glb downloaded!');
          } else {
            const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url;
            a.download = 'model.gltf'; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
            setStatus('SUCCESS: model.gltf downloaded (JSON)');
          }
        }, (err) => {
          setStatus('Export error: ' + (err.message || err), true);
        }, { binary: true, includeCustomExtensions: false, onlyVisible: false, trs: true });
      } catch (e) {
        setStatus('Export failed: ' + e.message, true);
      }
    }

    function logSceneTree() {
      if (!threeScene) { setStatus('No scene loaded.', true); return; }
      setStatus('Scene has ' + threeScene.children.length + ' children. Check F12 console.');
      function printTree(obj, indent) {
        const name = obj.name || '(unnamed)';
        const type = obj.type || obj.constructor?.name || '?';
        const extra = obj.geometry ? ' [geometry]' : '';
        console.log(indent + type + ' "' + name + '"' + extra);
        if (obj.children) for (const c of obj.children) printTree(c, indent + '  ');
      }
      console.log('=== SCENE TREE ===');
      printTree(threeScene, '');
      console.log('=== END ===');
      console.log('App keys:', Object.getOwnPropertyNames(splineApp));
    }

    // Drag & drop
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault(); dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.name.endsWith('.spline')) loadFile(file);
      else setStatus('Please drop a .spline file.', true);
    });
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) loadFile(file);
    });

    exportBtn.addEventListener('click', doExport);
    logBtn.addEventListener('click', logSceneTree);
  </script>
</body>
</html>
