<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spline to GLB Export</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #fff; }
    #drop-zone {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 420px; max-width: 90vw; padding: 48px 32px;
      border: 2px dashed #4b5563; border-radius: 16px;
      text-align: center; cursor: pointer; z-index: 9998;
      transition: border-color 0.2s, background 0.2s;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: #6366f1; background: rgba(99,102,241,0.08);
    }
    #drop-zone.hidden { display: none; }
    #drop-zone h2 { margin: 0 0 8px; font-size: 18px; color: #d1d5db; }
    #drop-zone p { margin: 0 0 8px; font-size: 13px; color: #6b7280; }
    #drop-zone .loading-msg { color: #fbbf24; font-size: 13px; margin-top: 12px; }
    #drop-zone .error-msg { color: #f87171; font-size: 13px; margin-top: 12px; }
    #controls {
      position: fixed; top: 16px; right: 16px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px;
    }
    button {
      padding: 10px 20px; border: none; border-radius: 8px;
      background: #6366f1; color: #fff; font-weight: 600;
      cursor: pointer; font-size: 14px;
    }
    button:hover { background: #4f46e5; }
    button:disabled { background: #374151; cursor: not-allowed; }
    #status {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #1f2937; padding: 8px 16px; border-radius: 8px;
      font-size: 13px; color: #9ca3af; z-index: 9999; max-width: 80vw;
      text-align: center;
    }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
  </style>
</head>
<body>
  <div id="drop-zone">
    <h2>Drop a .spline file here</h2>
    <p>or click to select</p>
    <div id="runtime-status" class="loading-msg">Loading Spline runtime…</div>
    <input type="file" id="file-input" accept=".spline" style="display:none" />
  </div>
  <div id="controls">
    <button id="exportBtn" disabled>Export GLB</button>
    <button id="logSceneBtn" disabled>Log Scene Tree</button>
  </div>
  <div id="status">Initializing…</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const dropZone = document.getElementById('drop-zone');
    const runtimeStatus = document.getElementById('runtime-status');
    const fileInput = document.getElementById('file-input');
    const statusEl = document.getElementById('status');
    const exportBtn = document.getElementById('exportBtn');
    const logBtn = document.getElementById('logSceneBtn');

    let splineApp = null;
    let threeScene = null;
    let Application = null;

    function setStatus(msg, isError) {
      console.log(isError ? '[ERROR]' : '[INFO]', msg);
      statusEl.textContent = msg;
    }

    function setDropZoneError(msg) {
      runtimeStatus.className = 'error-msg';
      runtimeStatus.textContent = msg;
    }

    function setDropZoneLoading(msg) {
      runtimeStatus.className = 'loading-msg';
      runtimeStatus.textContent = msg;
    }

    async function loadSplineRuntime() {
      const sources = [
        ['local', '/spline-runtime.js'],
        ['esm.sh', 'https://esm.sh/@splinetool/runtime@1.12.0'],
        ['jsdelivr-esm', 'https://cdn.jsdelivr.net/npm/@splinetool/runtime@1.12.0/+esm'],
        ['jsdelivr', 'https://cdn.jsdelivr.net/npm/@splinetool/runtime@1.12.0/build/runtime.js'],
      ];

      let lastError = null;
      for (const [label, url] of sources) {
        try {
          setDropZoneLoading('Loading runtime from ' + label + '…');
          const mod = await import(url);
          if (mod.Application) {
            setDropZoneLoading('Runtime ready.');
            return mod.Application;
          }
          // Some CDNs might use default export
          if (mod.default?.Application) return mod.default.Application;
          if (mod.default) return mod.default;
        } catch (e) {
          console.warn('Runtime source ' + label + ' failed:', e.message);
          lastError = e;
        }
      }
      throw new Error('All runtime sources failed. Last error: ' + (lastError?.message || 'unknown'));
    }

    function extractThreeScene(app) {
      if (app._scene?.isScene) return app._scene;
      if (app.scene) {
        if (app.scene.scene?.isScene) return app.scene.scene;
        if (app.scene.isScene) return app.scene;
      }
      for (const key of Object.getOwnPropertyNames(app)) {
        try { const v = app[key]; if (v && v.isScene) return v; } catch (e) {}
      }
      return null;
    }

    function resetApp() {
      threeScene = null;
      if (splineApp) {
        try { splineApp.dispose(); } catch(e) {}
        splineApp = null;
      }
      exportBtn.disabled = true;
      logBtn.disabled = true;
    }

    function ensureCanvas() {
      let canvas = document.querySelector('canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.id = 'spline-canvas';
        canvas.width = 800;
        canvas.height = 600;
        document.body.appendChild(canvas);
      }
      return canvas;
    }

    async function loadFile(file) {
      if (!Application) {
        setDropZoneError('Runtime not loaded. Please refresh the page.');
        return;
      }

      resetApp();
      dropZone.classList.add('hidden');

      try {
        const url = URL.createObjectURL(file);
        setStatus('Loading: ' + file.name + '…');

        const canvas = ensureCanvas();
        splineApp = new Application(canvas);
        setStatus('Spline app created, parsing file…');
        await splineApp.load(url);
        URL.revokeObjectURL(url);

        // Wait for textures and geometry to settle
        setStatus('Waiting for scene to finish loading…');
        await new Promise(r => setTimeout(r, 3000));

        threeScene = extractThreeScene(splineApp);

        if (!threeScene) {
          setStatus('ERROR: Scene loaded but cannot extract THREE.Scene. Check console for app keys.', true);
          console.log('Application keys:', Object.getOwnPropertyNames(splineApp));
          dropZone.classList.remove('hidden');
          setDropZoneError('Scene extraction failed. See console for debug info.');
          return;
        }

        setStatus('Loaded: ' + file.name + ' — ' + threeScene.children.length + ' children. Ready.');
        exportBtn.disabled = false;
        logBtn.disabled = false;
      } catch (e) {
        setStatus('FAILED: ' + e.message, true);
        console.error(e);
        dropZone.classList.remove('hidden');
        setDropZoneError('Load failed: ' + e.message);
      }
    }

    function doExport() {
      if (!threeScene) { setStatus('No scene loaded.', true); return; }
      setStatus('Exporting to GLB…');
      try {
        const exporter = new GLTFExporter();
        exporter.parse(threeScene, (result) => {
          if (result instanceof ArrayBuffer) {
            const blob = new Blob([result], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url;
            a.download = 'model.glb'; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
            setStatus('SUCCESS: model.glb downloaded!');
          } else {
            const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url;
            a.download = 'model.gltf'; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
            setStatus('SUCCESS: model.gltf downloaded');
          }
        }, (err) => setStatus('Export error: ' + (err.message || err), true),
        { binary: true, includeCustomExtensions: false, onlyVisible: false, trs: true });
      } catch (e) { setStatus('Export failed: ' + e.message, true); }
    }

    function logSceneTree() {
      if (!threeScene) { setStatus('No scene loaded.', true); return; }
      console.log('=== SCENE TREE (' + threeScene.children.length + ' children) ===');
      (function print(obj, indent) {
        const name = obj.name || '(unnamed)';
        const type = obj.type || obj.constructor?.name || '?';
        console.log(indent + type + ' "' + name + '"' + (obj.geometry ? ' [geometry]' : ''));
        if (obj.children) obj.children.forEach(c => print(c, indent + '  '));
      })(threeScene, '');
      console.log('=== END ===');
      console.log('App keys:', Object.getOwnPropertyNames(splineApp));
      setStatus('Scene tree logged to console (F12).');
    }

    // --- Init runtime on page load ---
    (async () => {
      try {
        Application = await loadSplineRuntime();
        setDropZoneLoading('Runtime ready — drop a .spline file.');
        setStatus('Ready. Drop a .spline file to begin.');
      } catch (e) {
        setDropZoneError('Failed to load Spline runtime: ' + e.message);
        setStatus('Runtime load failed. Check the error above.', true);
        console.error(e);
      }
    })();

    // --- Drag & drop ---
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault(); dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (!file) return;
      if (file.name.endsWith('.spline')) loadFile(file);
      else setDropZoneError('Please drop a .spline file. Got: ' + file.name);
    });
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) loadFile(file);
    });

    exportBtn.addEventListener('click', doExport);
    logBtn.addEventListener('click', logSceneTree);
  </script>
</body>
</html>
