<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Taro: multi-platform framework — layered squares with connection lines -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <!-- outer square -->
    <rect x="28" y="24" width="72" height="80" rx="8"/>
    <!-- inner square -->
    <rect x="44" y="40" width="40" height="48" rx="6"/>
    <!-- center dot -->
    <rect x="60" y="56" width="8" height="16" rx="3" fill="#ffffff"/>
    <!-- top platform connection dots -->
    <circle cx="64" cy="18" r="3" fill="#ffffff"/>
    <line x1="64" y1="21" x2="64" y2="28"/>
  </g>
</svg>